[project]
name = "alive-status"
version = "1.0.0"
description = "A FastAPI personal status page with secure POST-based updates."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web server
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.0.41",
    # Config parsing
    "pyyaml>=6.0.2",
    "toml>=0.10.2",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    # Trusted server-side NetEase/Meting resolver
    "httpx>=0.28.1",
    # Read embedded tags, cover art, and lyrics from uploaded local music
    "mutagen>=1.47.0",
    # Timezone parsing
    "pytz>=2025.2",
    "pillow>=11.3.0",
    # Colorful log
    "colorama>=0.4.6",
    # Scheduled tasks
    "schedule>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
