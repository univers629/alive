<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (() => {
            let mode = 'light';
            try {
                mode = localStorage.getItem('alive.colorMode')
                    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            } catch (error) {
                mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.colorMode = mode;
            document.documentElement.style.colorScheme = mode;
        })();
    </script>
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page_desc }}">
    <link rel="icon" href="{{ page_favicon }}">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('{{ url_for('static', filename='background-cache.js') }}', { scope: '/' }).catch(() => {});</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='page-shell.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='color-mode.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='site-chrome.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='device-cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='glass-select.css') }}" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="{{ url_for('static', filename='comment-wall.css') }}" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="{{ url_for('static', filename='site-footer.css') }}" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="{{ url_for('static', filename='music-island.css') }}" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="{{ url_for('static', filename='glass-select.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='comment-wall.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='site-footer.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='music-island.css') }}">
    </noscript>
</head>

<body data-page-background="{{ page_background }}">
    {{ site_chrome | safe }}
    <main class="container" id="main-content">
        {% for card_name, card_value in cards.items() %}
        <div class="card" id="{{ card_name }}">
            {{ card_value | safe }}
        </div>
        {% endfor %}
    </main>
    {{ comment_wall | safe }}
    {{ site_footer | safe }}
    {{ music_island | safe }}
</body>

<script type="module" src="{{ url_for('static', filename='get.js') }}" defer></script>
<script src="{{ url_for('static', filename='color-mode.js') }}" defer></script>
<script src="{{ url_for('static', filename='glass-select.js') }}" defer></script>
<script src="{{ url_for('static', filename='site-chrome.js') }}" defer></script>
<script src="{{ url_for('static', filename='background-loader.js') }}" defer></script>

{{ inject | safe }}

</html>
