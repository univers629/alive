<link rel="stylesheet" href="{{ url_for('static', filename='comment-wall.css') }}">

<div class="comment-wall__stage" id="danmaku-stage" aria-hidden="true"></div>

<section class="comment-wall" id="comment-wall" aria-labelledby="comment-wall-title"
    data-server-enabled="{{ 'true' if danmaku_enabled else 'false' }}">
    <div class="comment-wall__header">
        <div>
            <span class="comment-wall__eyebrow">LEAVE A TRACE</span>
            <h2 id="comment-wall-title">评论与弹幕</h2>
            <p>可以匿名，也可以留下一个临时昵称。</p>
        </div>
        <button class="comment-wall__toggle" id="danmaku-toggle" type="button"
            aria-pressed="{{ 'true' if danmaku_enabled else 'false' }}"
            {% if not danmaku_enabled %}disabled{% endif %}>
            <span aria-hidden="true"></span>
            弹幕{{ '开启' if danmaku_enabled else '关闭' }}
        </button>
    </div>

    <div class="comment-wall__content">
        <div class="comment-wall__history">
            <div class="comment-wall__subhead">
                <h3>最近留言</h3>
                <span id="comment-count">最近 8 条 · 正在读取</span>
            </div>
            <ol class="comment-wall__list" id="comment-list" aria-live="polite">
                <li class="comment-wall__empty">正在读取评论…</li>
            </ol>
        </div>

        <form class="comment-wall__form" id="comment-form">
            <div class="comment-wall__subhead">
                <h3>发一条弹幕</h3>
                <span>每 8 秒可发送一次</span>
            </div>
            <label>
                <span>昵称 <small>可留空</small></span>
                <input id="comment-nickname" name="nickname" maxlength="24" autocomplete="nickname"
                    placeholder="匿名访客">
            </label>
            <label>
                <span>想说的话</span>
                <textarea id="comment-content" name="content" maxlength="160" rows="3"
                    placeholder="说点什么吧…" required></textarea>
            </label>
            <label>
                <span>弹幕颜色</span>
                <select id="comment-color" name="color">
                    <option value="violet">柔紫</option>
                    <option value="cyan">湖蓝</option>
                    <option value="rose">珊瑚</option>
                    <option value="amber">暖金</option>
                    <option value="green">薄荷</option>
                </select>
            </label>
            <label class="comment-wall__honeypot" aria-hidden="true">
                <span>Website</span>
                <input id="comment-website" name="website" tabindex="-1" autocomplete="off">
            </label>
            <div class="comment-wall__actions">
                <span class="comment-wall__status" id="comment-status" role="status"></span>
                <button class="comment-wall__submit" type="submit">发送评论</button>
            </div>
        </form>
    </div>
</section>

<script src="{{ url_for('static', filename='comment-wall.js') }}" defer></script>
