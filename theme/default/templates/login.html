<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            (() => {
                let mode = 'light';
                try {
                    mode = localStorage.getItem('alive.colorMode')
                        || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                } catch (error) {
                    mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.colorMode = mode;
                document.documentElement.style.colorScheme = mode;
            })();
        </script>
        <title>{{ c.page.name }} - 登录</title>
        <meta name="description" content="登录到管理面板" />
        <link rel="icon" href="{{ c.page.favicon }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='color-mode.css') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" />
        <style>
            body {
                background: url('{{ c.page.background }}') no-repeat center center fixed;
                background-size: cover;
            }
        </style>
    </head>

    <body class="admin-login">
        <main class="login-container">
            <section class="login-card">
                <div class="login-card__top">
                    <span>ALIVE ADMIN</span>
                    <button class="color-mode-toggle" id="color-mode-toggle" type="button"
                        aria-label="切换为深色模式" aria-pressed="false">
                        <span class="color-mode-toggle__track" aria-hidden="true">
                            <span class="color-mode-toggle__thumb"></span>
                        </span>
                    </button>
                </div>
                <h2>管理面板登录</h2>
                <p>请输入密钥以访问管理面板</p>
                <div class="login-form" style="display: none">
                    <div class="form-group">
                        <label for="secret">密钥</label>
                        <input type="password" id="secret" placeholder="输入您的密钥" />
                    </div>
                    <button class="login-btn" onclick="login()">登录</button>
                    <p id="error-message" class="error-message">密钥错误，请重试</p>
                </div>
                <div id="loading-message" style="text-align: center; margin: 20px 0">
                    <p>正在验证登录状态...</p>
                </div>
                <a href="/" class="back-link">返回主页</a>
            </section>
        </main>

        <script>
            // 使用现代API登录方式
            document.body.setAttribute('data-use-modern-auth', 'true');
        </script>
        <script src="{{ url_for('static', filename='color-mode.js') }}" defer></script>
        <script src="{{ url_for('static', filename='login.js') }}" defer></script>
    </body>
</html>
